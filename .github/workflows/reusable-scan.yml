name: Reusable VSS Scan

on:
  workflow_call:
    inputs:
      target:
        description: 'Path to the binary, package, or directory to scan'
        required: false
        type: string
      url:
        description: 'URL to download the package/binary from before scanning'
        required: false
        type: string
      package-type:
        description: 'Package type: npm, python, ruby, go, rust, rpm, deb, or auto'
        required: false
        type: string
        default: 'auto'
      output-file:
        description: 'Output file path for scan results'
        required: false
        type: string
        default: 'vss-report.json'
      format:
        description: 'Output format: json, sarif, or table'
        required: false
        type: string
        default: 'json'
      fail-on-vuln:
        description: 'Fail if vulnerabilities are found'
        required: false
        type: boolean
        default: false
      upload-artifact:
        description: 'Upload scan report as artifact'
        required: false
        type: boolean
        default: true
      artifact-name:
        description: 'Name for the uploaded artifact'
        required: false
        type: string
        default: 'vss-scan-report'
    outputs:
      vulnerabilities-found:
        description: 'Number of vulnerabilities found'
        value: ${{ jobs.scan.outputs.vuln-count }}
      checksum:
        description: 'SHA256 checksum of scanned target'
        value: ${{ jobs.scan.outputs.checksum }}
      report-file:
        description: 'Path to the report file'
        value: ${{ jobs.scan.outputs.report-file }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vuln-count: ${{ steps.vss.outputs.vulnerabilities-found }}
      checksum: ${{ steps.vss.outputs.checksum }}
      report-file: ${{ steps.vss.outputs.report-file }}
    
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4
      
      - name: Run VSS Scan
        id: vss
        uses: kelleyblackmore/vss@v1
        with:
          target: ${{ inputs.target }}
          url: ${{ inputs.url }}
          package-type: ${{ inputs.package-type }}
          output-file: ${{ inputs.output-file }}
          format: ${{ inputs.format }}
          fail-on-vuln: ${{ inputs.fail-on-vuln }}
      
      - name: Display Results
        if: always()
        run: |
          echo "=== Scan Results ==="
          echo "Vulnerabilities Found: ${{ steps.vss.outputs.vulnerabilities-found }}"
          echo "Checksum: ${{ steps.vss.outputs.checksum }}"
          echo "Report File: ${{ steps.vss.outputs.report-file }}"
          
          if [ -f "${{ steps.vss.outputs.report-file }}" ]; then
            echo ""
            echo "=== Report Summary ==="
            cat "${{ steps.vss.outputs.report-file }}" | jq '.summary'
          fi
      
      - name: Upload Scan Report
        if: ${{ inputs.upload-artifact && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.output-file }}
          if-no-files-found: warn
